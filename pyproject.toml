[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ho-fl"
version = "0.2.0"
description = "HO-FL experiments with seed-generated client partitions"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.6.0",
  "transformers==4.56.2",
  "peft==0.17.1",
  "datasets==3.6.0",
  "accelerate==1.10.1",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "safetensors==0.6.2",
  "sentencepiece==0.2.1",
  "scipy==1.15.3",
]

[project.scripts]
ho-fl-train = "ho_fl.train:main"
ho-fl-profile = "ho_fl.profile:main"
ho-fl-memory = "ho_fl.memory:main"
ho-fl-replay = "ho_fl.replay:main"
ho-fl-supply = "ho_fl.supply:main"
ho-fl-analyze = "ho_fl.analysis:main"
ho-fl-sat-trace = "ho_fl.sat.cli:trace_main"
ho-fl-sat-train = "ho_fl.sat.cli:train_main"
ho-fl-sat-tune = "ho_fl.sat.cli:tune_main"
ho-fl-sat-topology = "ho_fl.sat.cli:topology_main"
ho-fl-sat-figures = "ho_fl.sat.cli:figures_main"

[tool.setuptools.packages.find]
include = ["ho_fl*"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]
# Satellite scenario (ho_fl.sat): the land mask decides where a satellite is imaging; Pillow decodes EuroSAT.
sat = ["global-land-mask==1.0.0", "pillow==11.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not gpu'"
markers = [
  "gpu: needs a CUDA GPU and the real models; select with `pytest -m gpu`",
]
